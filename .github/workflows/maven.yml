name: Build (Maven)

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  LEGACY_ARTIFACT_VERSION: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Maven wrapper (if present)
        run: |
          if [ -f ./mvnw ]; then
            chmod +x mvnw
          fi

      - name: Build with Maven
        run: mvn -B clean package

      - name: Verify final JAR
        shell: bash
        run: |
          JAR="target/SF_FoxyMachines_Legacy_v${LEGACY_ARTIFACT_VERSION}.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -Fq 'plugin.yml'
          unzip -p "$JAR" plugin.yml | grep -Fq "version: ${LEGACY_ARTIFACT_VERSION}"

      - name: Upload direct versioned Legacy JAR
        uses: actions/upload-artifact@v7
        with:
          path: target/SF_FoxyMachines_Legacy_v${{ env.LEGACY_ARTIFACT_VERSION }}.jar
          archive: false
          if-no-files-found: error
          retention-days: 30
