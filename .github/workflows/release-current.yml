name: Publish FoxyMachines Legacy Release

on:
  workflow_run:
    workflows: ["Build (Maven)"]
    types: [completed]

permissions:
  contents: write
  actions: read

env:
  LEGACY_VERSION: "1.0.0"
  LEGACY_ARTIFACT: "SF_FoxyMachines_Legacy_v1.0.0.jar"

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'master' || github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download current JAR
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.LEGACY_ARTIFACT }}
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${LEGACY_VERSION}"
          JAR="dist/${LEGACY_ARTIFACT}"
          test -s "$JAR"
          sha256sum "$JAR"
          cat > release-notes.md <<'EOF'
          ## FoxyMachines Legacy

          Current Slimefun Legacy release for Paper 26.2.

          - Includes the Slimefun Legacy world-storage compatibility fix.
          - Replaces the older Paper 26.2 test build with the current successful Maven build.
          - Current direct raw JAR: `SF_FoxyMachines_Legacy_v1.0.0.jar`.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
            gh release edit "$TAG" --title "FoxyMachines Legacy v${LEGACY_VERSION}" --notes-file release-notes.md --latest --prerelease=false
          else
            gh release create "$TAG" "$JAR" --target "${{ github.event.workflow_run.head_sha }}" --title "FoxyMachines Legacy v${LEGACY_VERSION}" --notes-file release-notes.md --latest
          fi
