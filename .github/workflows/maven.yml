name: Build FoxyMachines Legacy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "1.0.2"
  OUTPUT_NAME: "SF_FoxyMachines1.0.2.jar"
  SLIMEFUN_LEGACY_VERSION: "4.1.46"

concurrency:
  group: foxymachines-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install checksum-verified Apache Maven 3.10.0
        run: bash scripts/install_maven_3_10.sh

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<version>1.0.2</version>' pom.xml
          grep -Fq '<maven.compiler.release>21</maven.compiler.release>' pom.xml
          grep -Fq '<finalName>SF_FoxyMachines${project.version}</finalName>' pom.xml

      - name: Verify immutable release policy regressions
        run: python3 -m unittest discover -s scripts -p 'test_release_policy.py' -v

      - name: Install Slimefun Legacy 4.1.46 into local Maven repo
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy-deps
          gh release download "v${SLIMEFUN_LEGACY_VERSION}" \
            --repo wickidcow/Slimefun-Legacy \
            --pattern "Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar" \
            --dir legacy-deps
          LEGACY_JAR="legacy-deps/Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar"
          test -s "$LEGACY_JAR"
          mvn -B install:install-file \
            -Dfile="$LEGACY_JAR" \
            -DgroupId=com.github.wickidcow \
            -DartifactId=Slimefun-Legacy \
            -Dversion="${SLIMEFUN_LEGACY_VERSION}" \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Verify independent FoxyMachines loader policy unit tests (Paper 1.21.11 floor)
        run: >-
          mvn -B
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=com.github.wickidcow
          -Dslimefun.artifactId=Slimefun-Legacy
          -Dslimefun.version=${SLIMEFUN_LEGACY_VERSION}
          test

      - name: Verify Paper 1.21.11 compilation
        run: >-
          mvn -B -Dmaven.test.skip=true
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=com.github.wickidcow
          -Dslimefun.artifactId=Slimefun-Legacy
          -Dslimefun.version=${SLIMEFUN_LEGACY_VERSION}
          clean package

      - name: Verify Paper 26.2 compilation
        run: >-
          mvn -B -Dmaven.test.skip=true
          "-Dpaper.version=[26.2.build,26.3)"
          -Dslimefun.groupId=com.github.wickidcow
          -Dslimefun.artifactId=Slimefun-Legacy
          -Dslimefun.version=${SLIMEFUN_LEGACY_VERSION}
          clean package

      - name: Verify Paper 26.3 alpha compilation
        run: >-
          mvn -B -Dmaven.test.skip=true
          -Dpaper.version=26.3-rc-3.build.1-alpha
          -Dslimefun.groupId=com.github.wickidcow
          -Dslimefun.artifactId=Slimefun-Legacy
          -Dslimefun.version=${SLIMEFUN_LEGACY_VERSION}
          clean package

      - name: Build universal release JAR from 1.21.11 baseline
        run: >-
          mvn -B -Dmaven.test.skip=true
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=com.github.wickidcow
          -Dslimefun.artifactId=Slimefun-Legacy
          -Dslimefun.version=${SLIMEFUN_LEGACY_VERSION}
          clean package

      - name: Stage and validate versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="target/${OUTPUT_NAME}"
          test -s "$JAR"
          cp "$JAR" "dist/${OUTPUT_NAME}"
          JAR="dist/${OUTPUT_NAME}"
          jar tf "$JAR" | grep -Fq 'plugin.yml'
          unzip -p "$JAR" plugin.yml | grep -Fq 'version: 1.0.2'
          javap -verbose -classpath "$JAR" me.gallowsdove.foxymachines.FoxyMachines | grep -Fq 'major version: 65'
          if jar tf "$JAR" | grep -q '^io/github/thebusybiscuit/slimefun4/'; then
            echo 'Slimefun core classes must not be shaded into FoxyMachines.' >&2
            exit 1
          fi
          sha256sum "$JAR"

      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

      - name: Download released Slimefun Legacy 4.1.79 for native Paper fixture
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download v4.1.79 --repo wickidcow/Slimefun-Legacy \
            --pattern Slimefun-Legacy4.1.79.jar --dir legacy-deps
          test -s legacy-deps/Slimefun-Legacy4.1.79.jar

      - name: Verify native ticket probe source and Maven Paper API fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/runtime/foxy_chunk_policy_smoke.py
          mkdir -p build
          mvn -B -Dpaper.version=1.21.11-R0.1-SNAPSHOT \
            -Dslimefun.groupId=com.github.wickidcow \
            -Dslimefun.artifactId=Slimefun-Legacy \
            -Dslimefun.version=${SLIMEFUN_LEGACY_VERSION} \
            dependency:build-classpath \
            -Dmdep.outputFile=build/native-probe-classpath.txt
          test -s build/native-probe-classpath.txt
          find "$HOME/.m2/repository/io/papermc/paper/paper-api/1.21.11-R0.1-SNAPSHOT" \
            -maxdepth 1 -name 'paper-api-*.jar' ! -name '*sources*' ! -name '*javadoc*' \
            -print -quit | grep -q .

      - name: Native Paper 1.21.11 zero-player ticket and restart policy
        shell: bash
        run: |
          set -euo pipefail
          PAPER_API_JAR="$(find "$HOME/.m2/repository/io/papermc/paper/paper-api/1.21.11-R0.1-SNAPSHOT" \
            -maxdepth 1 -name 'paper-api-*.jar' ! -name '*sources*' ! -name '*javadoc*' \
            -print -quit)"
          python3 scripts/runtime/foxy_chunk_policy_smoke.py \
            --foxy-jar "dist/${OUTPUT_NAME}" \
            --slimefun-jar legacy-deps/Slimefun-Legacy4.1.79.jar \
            --paper-api-jar "$PAPER_API_JAR" \
            --compile-classpath-file build/native-probe-classpath.txt \
            --minecraft 1.21.11

      - name: Native Paper 26.2 zero-player ticket and restart policy
        shell: bash
        run: |
          set -euo pipefail
          PAPER_API_JAR="$(find "$HOME/.m2/repository/io/papermc/paper/paper-api/1.21.11-R0.1-SNAPSHOT" \
            -maxdepth 1 -name 'paper-api-*.jar' ! -name '*sources*' ! -name '*javadoc*' \
            -print -quit)"
          python3 scripts/runtime/foxy_chunk_policy_smoke.py \
            --foxy-jar "dist/${OUTPUT_NAME}" \
            --slimefun-jar legacy-deps/Slimefun-Legacy4.1.79.jar \
            --paper-api-jar "$PAPER_API_JAR" \
            --compile-classpath-file build/native-probe-classpath.txt \
            --minecraft 26.2

      - name: Native Paper 26.3 zero-player ticket and restart policy
        shell: bash
        run: |
          set -euo pipefail
          PAPER_API_JAR="$(find "$HOME/.m2/repository/io/papermc/paper/paper-api/1.21.11-R0.1-SNAPSHOT" \
            -maxdepth 1 -name 'paper-api-*.jar' ! -name '*sources*' ! -name '*javadoc*' \
            -print -quit)"
          python3 scripts/runtime/foxy_chunk_policy_smoke.py \
            --foxy-jar "dist/${OUTPUT_NAME}" \
            --slimefun-jar legacy-deps/Slimefun-Legacy4.1.79.jar \
            --paper-api-jar "$PAPER_API_JAR" \
            --compile-classpath-file build/native-probe-classpath.txt \
            --minecraft 26.3

      - name: Publish distinct immutable release (manual exact-tag only)
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/publish_immutable_release.sh
