name: Build FoxyMachines Legacy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_VERSION: "1.0.1"
  SOURCE_ARTIFACT: "SF_FoxyMachines_Legacy_v1.0.1.jar"
  OUTPUT_NAME: "SF_FoxyMachines1.0.1.jar"
  SLIMEFUN_LEGACY_VERSION: "4.1.46"

concurrency:
  group: foxymachines-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<version>1.0.1</version>' pom.xml
          grep -Fq '<maven.compiler.release>21</maven.compiler.release>' pom.xml

      - name: Install Slimefun Legacy 4.1.46 into local Maven repo
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy-deps
          gh release download "v${SLIMEFUN_LEGACY_VERSION}" \
            --repo wickidcow/Slimefun-Legacy \
            --pattern "Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar" \
            --dir legacy-deps
          LEGACY_JAR="legacy-deps/Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar"
          test -s "$LEGACY_JAR"
          mvn -B install:install-file \
            -Dfile="$LEGACY_JAR" \
            -DgroupId=com.github.wickidcow \
            -DartifactId=Slimefun-Legacy \
            -Dversion="${SLIMEFUN_LEGACY_VERSION}" \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Run Maven test lifecycle against Paper 26.2 and Slimefun Legacy
        run: >-
          mvn -B
          -Dpaper.version=26.2.build.111-stable
          -Dslimefun.groupId=com.github.wickidcow
          -Dslimefun.artifactId=Slimefun-Legacy
          -Dslimefun.version=${SLIMEFUN_LEGACY_VERSION}
          clean test

      - name: Compile against Slimefun Legacy 4.1.46 / Paper 1.21.11
        run: >-
          mvn -B -Dmaven.test.skip=true
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=com.github.wickidcow
          -Dslimefun.artifactId=Slimefun-Legacy
          -Dslimefun.version=${SLIMEFUN_LEGACY_VERSION}
          clean package

      - name: Compile against Slimefun Legacy 4.1.46 / Paper 26.2
        run: >-
          mvn -B -Dmaven.test.skip=true
          -Dpaper.version=26.2.build.111-stable
          -Dslimefun.groupId=com.github.wickidcow
          -Dslimefun.artifactId=Slimefun-Legacy
          -Dslimefun.version=${SLIMEFUN_LEGACY_VERSION}
          clean package

      - name: Build release JAR against primary Paper 26.2 target
        run: >-
          mvn -B -Dmaven.test.skip=true
          -Dpaper.version=26.2.build.111-stable
          -Dslimefun.groupId=com.github.wickidcow
          -Dslimefun.artifactId=Slimefun-Legacy
          -Dslimefun.version=${SLIMEFUN_LEGACY_VERSION}
          clean package

      - name: Stage and validate versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="target/${SOURCE_ARTIFACT}"
          test -s "$JAR"
          cp "$JAR" "dist/${OUTPUT_NAME}"
          JAR="dist/${OUTPUT_NAME}"
          jar tf "$JAR" | grep -Fq 'plugin.yml'
          unzip -p "$JAR" plugin.yml | grep -Fq 'version: 1.0.1'
          javap -verbose -classpath "$JAR" me.gallowsdove.foxymachines.FoxyMachines | grep -Fq 'major version: 65'
          if jar tf "$JAR" | grep -q '^io/github/thebusybiscuit/slimefun4/'; then
            echo 'Slimefun core classes must not be shaded into FoxyMachines.' >&2
            exit 1
          fi
          sha256sum "$JAR"

      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

      - name: Publish raw JAR release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${LEGACY_VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          NOTES="Slimefun Legacy compatibility release. Modernized for current Paper APIs, compiled directly against Slimefun Legacy ${SLIMEFUN_LEGACY_VERSION} on Paper 1.21.11 and Paper 26.2, ran the Maven test lifecycle, verified Java 21 bytecode, and checked that Slimefun core classes are not shaded into the addon."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --notes "$NOTES" --title "SF_FoxyMachines $TAG"
          fi
